<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step Tracker Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Step Tracker</h1>
      <p class="subtitle">Auto-calculating steps using your device sensors</p>
    </header>

    <div class="card current-card">
      <h2>Today's Progress</h2>
      <div class="step-display">
        <span id="today-steps">0</span>
        <span class="label">Steps</span>
      </div>
      <div id="sensor-status" class="status-badge waiting">Waiting for sensor permission...</div>
      <button id="permission-btn" class="btn">Enable Auto Step Tracking</button>
      <button id="simulate-btn" class="btn btn-secondary" style="margin-top: 10px;">Simulate Step (Testing)</button>
    </div>

    <div class="card history-card">
      <h2>History</h2>
      <ul id="history-list">
        <!-- History loaded dynamically -->
      </ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
